aid: absology
name: Absology
description: >-
  Absology Co., Ltd. is a South Korean in-vitro diagnostics (IVD) company founded in 2017 and
  headquartered in Anyang, Gyeonggi-do. It designs and manufactures point-of-care immunoassay
  analyzers and the reagent cartridges that run on them, built on microfluidic immunoassay and
  photo-oxidation-induced fluorescence amplification chemistry. Its Absol analyzer line runs rapid
  and ultra-sensitive quantitative blood tests — testosterone, vitamin D, PSA, TSH, free T4, PCT,
  cortisol and cardiac markers — for human and companion-animal use, with stated research programs
  in anti-cancer therapy monitoring, cardiovascular disease and neurodegenerative disease. Absology
  is a hardware and consumables manufacturer rather than a software vendor, and no public developer
  program, API, SDK or machine-readable contract has been found on its corporate site or in any
  public package registry or code host.
